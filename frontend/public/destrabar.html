<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Destrabar la página — MAX 10</title>
<style>
  *{box-sizing:border-box;margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{background:#333F50;color:#fff;min-height:100vh;display:flex;align-items:center;
       justify-content:center;padding:24px}
  .caja{max-width:520px;width:100%;background:#3C4759;border:1px solid #4A5568;
        border-radius:18px;padding:26px 24px}
  h1{font-size:20px;font-weight:900;letter-spacing:.02em;margin-bottom:6px}
  .sub{color:#C9D2DE;font-size:13px;line-height:1.55;margin-bottom:18px}
  ol{margin:0 0 18px 18px;color:#C9D2DE;font-size:13px;line-height:1.7}
  b{color:#fff}
  #log{background:#2B3547;border:1px solid #4A5568;border-radius:12px;padding:14px;
       font-size:12.5px;line-height:1.7;white-space:pre-wrap;min-height:96px;color:#C9D2DE}
  .ok{color:#5BE39B;font-weight:800}
  .mal{color:#F0A6A3;font-weight:800}
  button{margin-top:18px;width:100%;background:#00B050;border:0;border-radius:12px;color:#fff;
         font-weight:900;font-size:14px;padding:14px;cursor:pointer;letter-spacing:.04em}
  button:hover{filter:brightness(1.15)}
  button[disabled]{opacity:.5;cursor:default}
</style>
</head>
<body>
<div class="caja">
  <h1>DESTRABAR LA PÁGINA</h1>
  <p class="sub">
    Esto le quita al navegador la copia vieja que tiene guardada de la plataforma.
    Úsalo cuando hiciste cambios y en pantalla sigue viéndose lo de antes.
    No borra ningún dato de la academia: solo la copia del navegador.
  </p>

  <div id="log">Trabajando…</div>

  <button id="ir" disabled>ABRIR LA PLATAFORMA</button>
</div>

<script>
(async function () {
  var log = document.getElementById('log');
  var ir  = document.getElementById('ir');
  var lineas = [];
  function di(t, clase) {
    lineas.push(clase ? '<span class="' + clase + '">' + t + '</span>' : t);
    log.innerHTML = lineas.join('\n');
  }

  di('Origen: ' + location.origin);

  /* 1. El "ayudante" (service worker). Si quedó instalado uno viejo, es el que
        sigue entregando la página de antes por más que uno recargue. */
  try {
    if ('serviceWorker' in navigator) {
      var regs = await navigator.serviceWorker.getRegistrations();
      if (!regs.length) {
        di('· Ayudantes instalados: ninguno.');
      } else {
        for (var i = 0; i < regs.length; i++) await regs[i].unregister();
        di('· Ayudantes desinstalados: ' + regs.length, 'ok');
      }
    } else {
      di('· Este navegador no usa ayudantes.');
    }
  } catch (e) {
    di('· No se pudo revisar el ayudante: ' + e.message, 'mal');
  }

  /* 2. Las copias guardadas. */
  try {
    if (window.caches) {
      var nombres = await caches.keys();
      for (var j = 0; j < nombres.length; j++) await caches.delete(nombres[j]);
      di('· Copias borradas: ' + nombres.length, 'ok');
    }
  } catch (e) {
    di('· No se pudieron borrar las copias: ' + e.message, 'mal');
  }

  di('');
  di('LISTO. Ahora oprime el botón verde.', 'ok');
  di('Si aun así sale lo de antes, cierra TODAS las pestañas de la');
  di('plataforma y vuelve a abrirla.');

  ir.disabled = false;
  ir.onclick = function () {
    /* El número del final obliga al navegador a pedir la página de nuevo. */
    location.href = '/login?nuevo=' + Date.now();
  };
})();
</script>
</body>
</html>
